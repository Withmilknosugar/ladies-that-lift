.cls{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}.cls-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}.cls-title{flex:1;text-align:left;background:none;border:0;padding:0}.cls-name{display:block;font-family:var(--display);font-weight:700;font-size:22px;text-transform:uppercase}.cls-when{display:block;font-size:13px;color:var(--muted)}.cap{display:flex;flex-direction:column;align-items:flex-end;gap:4px}.plates{display:flex;gap:3px}.plates i{width:11px;height:11px;border-radius:50%;border:2px solid var(--ink)}.plates i.on{background:var(--gold)}.cap span{font-size:12px;color:var(--muted)}.rows{list-style:none;margin:0;padding:0}.row{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line)}.who{flex:1;min-width:0;text-align:left;background:none;border:0;padding:6px 0}.who .nm{display:block;font-weight:600}.who .sub{display:block;font-size:12px;color:var(--muted)}.pay{flex:none;min-width:70px;min-height:38px;border-radius:999px;border:1.5px solid var(--warn);background:var(--warn-bg);color:var(--warn);font-weight:700}.pay.paid{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}.att{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}.att button{width:40px;height:38px;border:0;background:transparent;color:var(--muted);font-weight:700}.att button+button{border-left:1.5px solid var(--line)}.att button.y[aria-pressed="true"]{background:var(--ok-bg);color:var(--ok)}.att button.n[aria-pressed="true"]{background:var(--warn-bg);color:var(--warn)}.empty-row{padding:12px 14px;color:var(--muted)}.add{display:block;width:100%;border:0;background:none;padding:12px 14px;text-align:left;font-weight:700;color:var(--accent)}.full{padding:12px 14px;color:var(--muted);font-weight:600}.ghost{border:1.5px dashed var(--line);background:none;border-radius:14px;padding:14px;font-weight:700;color:var(--accent);width:100%}.li .btn{min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:0 16px;font-weight:700}.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}.btn.danger{color:var(--warn);border-color:var(--warn)}dialog{margin:auto auto 0;width:100%;max-width:560px;border:0;padding:0;background:var(--surface);color:var(--ink);border-radius:20px 20px 0 0;max-height:88%;overflow:auto}dialog::backdrop{background:rgba(15,12,8,.6)}.sheet-in{display:flex;flex-direction:column;gap:14px;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}.sheet-in h2{margin:0;font-family:var(--display);font-size:24px;text-transform:uppercase}.sheet-in p{margin:0;color:var(--muted)}.sheet-in form{display:flex;flex-direction:column;gap:10px}.sheet-in label{font-size:13px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;gap:4px}.sheet-in input,.sheet-in select,.sheet-in textarea{min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);padding:10px 12px;font-size:16px;width:100%}.sheet-in textarea{min-height:96px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.moves{display:flex;flex-direction:column;gap:6px}.move{display:flex;justify-content:space-between;align-items:center;min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);padding:8px 12px;text-align:left}.move.cur{border-color:var(--accent)}.move:disabled{opacity:.5}.actions{display:flex;gap:10px}.actions .btn{flex:1}#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px}

<main class="wrap" id="app"></main><dialog id="sheet" aria-label="Edit"></dialog><div id="toast" role="status" hidden></div>
<script>
(function(){
var CAP=6,LS='ladies-that-lift-v1',DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var classes=[],members=[],ready=true,note='Saved on this iPhone only. Use “Back up or restore” to keep a copy.',filter='all';
var app=document.getElementById('app'),sheet=document.getElementById('sheet'),toastEl=document.getElementById('toast');
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function pad(n){return n<10?'0'+n:''+n}function mondayOf(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}function keyOf(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}function shortDate(d){return d.getDate()+' '+MONTHS[d.getMonth()]}function newId(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}var thisWeek=mondayOf(new Date()),week=thisWeek;function wk(){return keyOf(week)}
var toastTimer;function toast(msg){toastEl.textContent=msg;toastEl.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(function(){toastEl.hidden=true},2600)}function save(){try{localStorage.setItem(LS,JSON.stringify({classes:classes,members:members}))}catch(e){}}
try{var raw=JSON.parse(localStorage.getItem(LS)||'null');if(raw){classes=raw.classes||[];members=raw.members||[]}}catch(e){}
function put(coll,doc){var arr=coll==='classes'?classes:members,i=arr.findIndex(function(x){return x.id===doc.id});if(i<0)arr.push(doc);else arr[i]=doc;save();render()}function patch(coll,id,p){var arr=coll==='classes'?classes:members,i=arr.findIndex(function(x){return x.id===id});if(i<0)return;var next=Object.assign({},arr[i],p);if(p.att)next.att=Object.assign({},arr[i].att||{},p.att);arr[i]=next;save();render()}function remove(coll,id){if(coll==='classes')classes=classes.filter(function(x){return x.id!==id});else members=members.filter(function(x){return x.id!==id});save();render()}function sortedClasses(){return classes.slice().sort(function(a,b){return(a.order||0)-(b.order||0)||String(a.name).localeCompare(String(b.name))})}function inClass(id){return members.filter(function(m){return m.classId===id}).sort(function(a,b){return String(a.name).localeCompare(String(b.name))})}function waiting(){var ids={};classes.forEach(function(c){ids[c.id]=1});return members.filter(function(m){return!m.classId||!ids[m.classId]}).sort(function(a,b){return String(a.name).localeCompare(String(b.name))})}function whenText(c){if(c.day==null||c.day==='')return'Tap to set day and time';var d=new Date(week);d.setDate(d.getDate()+Number(c.day));return DAYS[c.day]+' '+shortDate(d)+(c.time?' · '+c.time:'')}function slotText(c){return(c.day==null||c.day==='')?'':DAYS[c.day]+(c.time?' '+c.time:'')}function tally(m){var y=0,n=0,a=m.att||{};for(var k in a){if(a[k]==='y')y++;else if(a[k]==='n')n++}return{y:y,n:n}}
function rowHtml(m,withAtt){var t=tally(m),mark=(m.att||{})[wk()]||'',sub=(t.y+t.n)?t.y+' attended'+(t.n?', '+t.n+' missed':''):'No sessions marked yet';return'<li class="row"><button class="who" data-act="member" data-id="'+esc(m.id)+'"><span class="nm">'+esc(m.name)+'</span><span class="sub">'+sub+'</span></button><button class="pay'+(m.paid?' paid':'')+'" data-act="pay" data-id="'+esc(m.id)+'">'+(m.paid?'Paid':'Unpaid')+'</button>'+ (withAtt?'<div class="att"><button class="y" data-act="att" data-v="y" data-id="'+esc(m.id)+'" aria-pressed="'+(mark==='y')+'">✓</button><button class="n" data-act="att" data-v="n" data-id="'+esc(m.id)+'" aria-pressed="'+(mark==='n')+'">✕</button></div>':'')+'</li>'}
function render(){document.getElementById('weekLabel').innerHTML='Week of '+shortDate(week)+'<small>'+ (keyOf(week)===keyOf(thisWeek)?'This week':'Tap to return to this week')+'</small>';if(!ready){app.innerHTML='<div class="blank"><p>Loading…</p></div>';return}var h='';if(note)h+='<div class="note">'+esc(note)+'</div>';var cls=sortedClasses(),wait=waiting();if(!cls.length&&!members.length){app.innerHTML=h+'<div class="blank"><h2>No classes yet</h2><p>Create five weekly classes of six.</p><button class="btn primary" data-act="seed">Create 5 classes</button></div>';return}var unpaid=members.filter(function(m){return!m.paid}).length,spaces=cls.reduce(function(n,c){return n+Math.max(0,CAP-inClass(c.id).length)},0);h+='<div class="summary"><div class="stat"><b>'+members.length+'</b><span>Members</span></div><div class="stat'+(unpaid?' alert':'')+'"><b>'+unpaid+'</b><span>Unpaid</span></div><div class="stat"><b>'+spaces+'</b><span>Spaces free</span></div></div>';h+='<div class="filters"><button class="chip" data-act="filter" data-v="all" aria-pressed="'+(filter==='all')+'">Everyone</button><button class="chip" data-act="filter" data-v="unpaid" aria-pressed="'+(filter==='unpaid')+'">Unpaid only</button></div>';cls.forEach(function(c){var all=inClass(c.id),shown=filter==='unpaid'?all.filter(function(m){return!m.paid}):all,plates='';for(var i=0;i<CAP;i++)plates+='<i'+(i<all.length?' class="on"':'')+'></i>';h+='<section class="cls"><div class="cls-head"><button class="cls-title" data-act="class" data-id="'+esc(c.id)+'"><span class="cls-name">'+esc(c.name)+'</span><span class="cls-when">'+esc(whenText(c))+'</span></button><div class="cap"><div class="plates">'+plates+'</div><span>'+all.length+' of '+CAP+'</span></div></div><ul class="rows">';if(!shown.length)h+='<li class="empty-row">'+(filter==='unpaid'?(all.length?'Everyone here has paid.':'No one in this class yet.'):'No one in this class yet.')+'</li>';shown.forEach(function(m){h+=rowHtml(m,true)});h+='</ul>';h+=all.length>=CAP?' <div class="full">Class full</div>':'<button class="add" data-act="add" data-id="'+esc(c.id)+'">+ Add member</button>';h+='</section>'});var waitShown=filter==='unpaid'?wait.filter(function(m){return!m.paid}):wait;h+='<section class="cls"><div class="cls-head"><div class="cls-title"><span class="cls-name">Waiting list</span><span class="cls-when">Not in a class yet</span></div><div class="cap"><span>'+wait.length+'</span></div></div><ul class="rows">';if(!waitShown.length)h+='<li class="empty-row">No one waiting.</li>';waitShown.forEach(function(m){h+=rowHtml(m,false)});h+='</ul>'+ (filter==='all'?'<button class="add" data-act="add" data-id="">+ Add to waiting list</button>':'')+'</section>';h+='<button class="ghost" data-act="addclass">+ Add another class</button><button class="link" data-act="newblock">Start a new block (mark everyone unpaid)</button><button class="link" data-act="backup">Back up or restore</button>';app.innerHTML=h}
function openSheet(html,sel){sheet.innerHTML='<div class="sheet-in">'+html+'</div>';if(!sheet.open)sheet.showModal();if(sel){var e=sheet.querySelector(sel);if(e)e.focus()}}function closeSheet(){if(sheet.open)sheet.close()}function findC(id){return classes.find(function(c){return c.id===id})}function findM(id){return members.find(function(m){return m.id===id})}
function addSheet(classId){var c=classId?findC(classId):null,n=c?inClass(c.id).length:0;openSheet('<h2>Add to '+esc(c?c.name:'waiting list')+'</h2>'+ (c?'<p>'+n+' of '+CAP+' places taken.</p>':'')+'<form data-form="add" data-id="'+esc(classId||'')+'"><label>Name<input id="f-add-name" name="name" required maxlength="60"></label><div class="actions"><button type="button" class="btn" data-act="close">Done</button><button class="btn primary">Add</button></div></form>','#f-add-name')}
function memberSheet(id){var m=findM(id);if(!m)return;var t=tally(m),moves='';sortedClasses().forEach(function(c){var n=inClass(c.id).length,cur=m.classId===c.id,full=n>=CAP&&!cur;moves+='<button class="move'+(cur?' cur':'')+'" data-act="move" data-id="'+esc(m.id)+'" data-to="'+esc(c.id)+'"'+(cur||full?' disabled':'')+'><span>'+esc(c.name)+(slotText(c)?' · '+esc(slotText(c)):'')+'</span><small>'+ (cur?'Current':full?'Full':(CAP-n)+' free')+'</small></button>'});var waiting=!m.classId||!findC(m.classId);moves+='<button class="move'+(waiting?' cur':'')+'" data-act="move" data-id="'+esc(m.id)+'" data-to=""'+(waiting?' disabled':'')+'><span>Waiting list</span></button>';openSheet('<h2>'+esc(m.name)+'</h2><p>'+ (m.paid?'Paid':'Not paid')+' · '+t.y+' attended, '+t.n+' missed</p><form data-form="rename" data-id="'+esc(m.id)+'"><label>Name<input name="name" value="'+esc(m.name)+'" required maxlength="60"></label><button class="btn">Save name</button></form><p><strong>Move to</strong></p><div class="moves">'+moves+'</div><div class="actions"><button class="btn danger" data-act="askremove" data-id="'+esc(m.id)+'">Remove member</button><button class="btn" data-act="close">Close</button></div>')}
function classSheet(id){var c=id?findC(id):null;if(id&&!c)return;var opts='<option value="">Not set</option>';['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'].forEach(function(d,i){opts+='<option value="'+i+'"'+(c&&c.day!=null&&c.day!==''&&Number(c.day)===i?' selected':'')+'>'+d+'</option>'});openSheet('<h2>'+ (c?'Edit class':'New class')+'</h2><form data-form="class" data-id="'+esc(id||'')+'"><label>Class name<input name="name" value="'+esc(c?c.name:'Class '+(classes.length+1))+'" required maxlength="40"></label><div class="two"><label>Day<select name="day">'+opts+'</select></label><label>Time<input name="time" type="time" value="'+esc(c&&c.time||'')+'"></label></div><div class="actions">'+(c?'<button type="button" class="btn danger" data-act="askdelclass" data-id="'+esc(c.id)+'">Delete class</button>':'<button type="button" class="btn" data-act="close">Cancel</button>')+'<button class="btn primary">Save</button></div></form>')}
function confirm(title,text,act,id,label){openSheet('<h2>'+esc(title)+'</h2><p>'+esc(text)+'</p><div class="actions"><button class="btn" data-act="close">Cancel</button><button class="btn danger" data-act="'+act+'" data-id="'+esc(id||'')+'">'+esc(label)+'</button></div>')}
var pendingRestore=null,ID_OK=/^[A-Za-z0-9_-]{1,60}$/;function backupSheet(){var text=JSON.stringify({app:'ladies-that-lift',saved:keyOf(new Date()),classes:classes,members:members});openSheet('<h2>Back up or restore</h2><p>Copy this text and keep it somewhere safe.</p><label>Your backup<textarea id="f-backup-out" readonly></textarea></label><button class="btn primary" data-act="copybackup">Copy backup</button><label>Restore: paste a backup here<textarea id="f-backup-in"></textarea></label><div class="actions"><button class="btn" data-act="close">Close</button><button class="btn danger" data-act="askrestore">Restore</button></div>');document.getElementById('f-backup-out').value=text}function parseBackup(raw){var d;try{d=JSON.parse(String(raw||'').trim())}catch(e){return null}if(!d||!Array.isArray(d.classes)||!Array.isArray(d.members))return null;var cs=[],ms=[],ids={};d.classes.forEach(function(c,i){if(!c||!ID_OK.test(String(c.id))||ids[c.id])return;ids[c.id]=1;var day=c.day===null||c.day===undefined||c.day===''?null:Number(c.day);if(day!==null&&!(day>=0&&day<=6))day=null;cs.push({id:String(c.id),name:String(c.name||'Class').slice(0,40),day:day,time:/^\d\d:\d\d$/.test(String(c.time))?String(c.time):'',order:Number(c.order)||i+1})});var seen={};d.members.forEach(function(m){if(!m||!ID_OK.test(String(m.id))||seen[m.id])return;seen[m.id]=1;var att={},a=m.att||{};for(var k in a)if(/^\d{4}-\d\d-\d\d$/.test(k)&&(a[k]==='y'||a[k]==='n'))att[k]=a[k];ms.push({id:String(m.id),name:String(m.name||'Member').slice(0,60),classId:ids[m.classId]?String(m.classId):null,paid:!!m.paid,att:att})});return{classes:cs,members:ms}}
function act(a,el){var id=el.getAttribute('data-id')||'',m,c;if(a==='close')return closeSheet();if(a==='filter'){filter=el.getAttribute('data-v');return render()}if(a==='pay'){m=findM(id);if(m)patch('members',id,{paid:!m.paid});return}if(a==='att'){m=findM(id);if(!m)return;var v=el.getAttribute('data-v'),o={};o[wk()]=(m.att||{})[wk()]===v?'':v;return patch('members',id,{att:o})}if(a==='member')return memberSheet(id);if(a==='class')return classSheet(id);if(a==='addclass')return classSheet('');if(a==='add')return addSheet(id);if(a==='seed'){for(var i=1;i<=5;i++)put('classes',{id:newId('c'),name:'Class '+i,day:null,time:'',order:i});return}if(a==='move'){var to=el.getAttribute('data-to')||'';if(to&&inClass(to).length>=CAP)return toast('That class is full.');m=findM(id);patch('members',id,{classId:to||null});closeSheet();c=to?findC(to):null;return toast((m?m.name:'Member')+' moved to '+(c?c.name:'the waiting list')+'.')}if(a==='askremove'){m=findM(id);if(m)confirm('Remove '+m.name+'?','This deletes her payment and attendance record.','remove',id,'Remove');return}if(a==='remove'){remove('members',id);return closeSheet()}if(a==='askdelclass'){c=findC(id);if(c)confirm('Delete '+c.name+'?','Anyone in this class moves to the waiting list.','delclass',id,'Delete class');return}if(a==='delclass'){inClass(id).forEach(function(x){patch('members',x.id,{classId:null})});remove('classes',id);return closeSheet()}if(a==='backup')return backupSheet();if(a==='copybackup'){var ta=document.getElementById('f-backup-out'),fallback=function(){ta.focus();ta.select();toast('Text selected. Tap Copy.')};try{navigator.clipboard.writeText(ta.value).then(function(){toast('Backup copied.')},fallback)}catch(e){fallback()}return}if(a==='askrestore'){var parsed=parseBackup(document.getElementById('f-backup-in').value);if(!parsed)return toast('That does not look like a Ladies That Lift backup.');pendingRestore=parsed;return confirm('Restore this backup?','This replaces everything currently in the app with '+parsed.classes.length+' classes and '+parsed.members.length+' members.','dorestore','','Replace and restore')}if(a==='dorestore'){if(!pendingRestore)return closeSheet();var data=pendingRestore;pendingRestore=null;members.slice().forEach(function(x){remove('members',x.id)});classes.slice().forEach(function(x){remove('classes',x.id)});data.classes.forEach(function(x){put('classes',x)});data.members.forEach(function(x){put('members',x)});closeSheet();return toast('Backup restored.')}if(a==='newblock')return confirm('Start a new block?','Everyone is marked unpaid. Classes and attendance history stay.','resetpay','','Mark all unpaid');if(a==='resetpay'){members.filter(function(x){return x.paid}).forEach(function(x){patch('members',x.id,{paid:false})});closeSheet();return toast('Everyone marked unpaid.')}}
function onClick(e){var el=e.target.closest('[data-act]');if(el&&!el.disabled)act(el.getAttribute('data-act'),el)}app.addEventListener('click',onClick);sheet.addEventListener('click',function(e){if(e.target===sheet)return closeSheet();onClick(e)});sheet.addEventListener('submit',function(e){e.preventDefault();var f=e.target,kind=f.getAttribute('data-form'),id=f.getAttribute('data-id')||'',name=(f.elements.name.value||'').trim();if(!name)return;if(kind==='add'){if(id&&inClass(id).length>=CAP)return toast('That class is full.');put('members',{id:newId('m'),name:name,classId:id||null,paid:false,att:{}});toast(name+' added.');if(id&&inClass(id).length>=CAP)closeSheet();else addSheet(id)}else if(kind==='rename'){patch('members',id,{name:name});closeSheet()}else if(kind==='class'){var dv=f.elements.day.value,data={name:name,day:dv===''?null:Number(dv),time:f.elements.time.value||''};if(id)patch('classes',id,data);else{data.id=newId('c');data.order=classes.reduce(function(n,c){return Math.max(n,c.order||0)},0)+1;put('classes',data)}closeSheet()}});document.getElementById('prevWeek').addEventListener('click',function(){week=new Date(week.getFullYear(),week.getMonth(),week.getDate()-7);render()});document.getElementById('nextWeek').addEventListener('click',function(){week=new Date(week.getFullYear(),week.getMonth(),week.getDate()+7);render()});document.getElementById('weekLabel').addEventListener('click',function(){week=thisWeek;render()});render();
})();
